[MT5]
SYMBOL = XAUUSD
TIMEFRAME = M15
MAGIC_NUMBER = 987654
DRY_RUN = True

[MODEL]
MODEL_PATH = lstm_intraday_best.pt
DATA_META_FILE = dl_intraday_dataset_seq64.npz
THR_LONG = 0.70
THR_SHORT = 0.30

[ATR_SLTP]
ATR_COL = atr_14_m15
ATR_MULT_SL = 1.2
RR_TP = 2.0          ; fallback kalau USE_DYNAMIC_TP = False di engine

[LOTS]
; Ini cuma fallback kalau USE_DYNAMIC_RISK = False di kode
RISK_PER_TRADE = 0.01
MIN_LOT = 0.02
MAX_LOT = 0.60

[COST_SIMULATION]
COMMISSION_PER_001 = 0.06
SPREAD_HIDDEN_USD  = 0.037

; =======================
;  DYNAMIC RISK (HYBRID)
; =======================
[RISK_DYNAMIC]
USE_DYNAMIC_RISK = True
BASE_RISK_PCT = 0.02    ; 2.0%
MIN_RISK_PCT  = 0.05    ; 5.0%
MAX_RISK_PCT  = 0.10    ; 10.0%

; =======================
;  REGIME FILTER
; =======================
[REGIME]
USE_REGIME_FILTERS = True
ATR_MA_PERIOD = 50
ATR_MIN_MULT  = 1.0

ADX_COL = ADX_14
ADX_MIN = 15.0

; =======================
;  SESSION FILTER
; =======================
[SESSION]
USE_SESSION_FILTER = True
SESSION_START_HOUR = 7
SESSION_END_HOUR   = 22

; =======================
;  MTF TREND (H1 EMA 50/200)
; =======================
[MTF_TREND]
USE_MTF_FILTER = True
MTF_TREND_COL = trend_h1_dir
H1_EMA_FAST   = 50
H1_EMA_SLOW   = 200

; =======================
;  DYNAMIC TP / RR
; =======================
[RR_DYNAMIC]
USE_DYNAMIC_TP   = True
RR_TP_BASE       = 2.0
ADX_TP_MED       = 20.0
ADX_TP_STRONG    = 25.0
RR_TP_MED_TREND  = 2.5
RR_TP_STRONG_TREND = 3.0

; =======================
;  PIP & SLIPPAGE MODEL
;  (angka sama dengan rumus di backtest)
; =======================
[PIP_MODEL]
PIP_SIZE           = 0.01       ; 1 pip XAUUSD = 0.01 harga
PIP_VALUE_PER_001  = 0.01       ; USD per pip untuk 0.01 lot
SPREAD_PIPS        = 3.7        ; 0.037 / 0.01
MAX_SLIPPAGE_PIPS  = 11.1       ; 3 * spread
AVG_SLIPPAGE_PIPS  = 5.55       ; 0.5 * max_slippage
